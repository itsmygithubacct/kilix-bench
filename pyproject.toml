[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-bench"
version = "0.2.4"
description = "Offscreen frame-path measurements for Kilix"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "itsmygithubacct"}]

[project.scripts]
kilix-bench = "kilix_bench.__main__:main"
kilix-yesno = "kilix_bench.yesno.cli:main"
kilix-yesno-tui = "kilix_bench.yesno.cli:tui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kilix_bench.yesno" = ["LICENSE"]
"kilix_bench.coding_tasks" = ["*.yaml", "common"]
"kilix_bench.onebit" = [
    "system-prompt-v1.txt",
    "items/*.jsonl",
    "items/CANARY",
    "items/MANIFEST.json",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-bench"
version = "0.2.3"
description = "Offscreen frame-path measurements for Kilix"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "itsmygithubacct"}]

[project.scripts]
kilix-bench = "kilix_bench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

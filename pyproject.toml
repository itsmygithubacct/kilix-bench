[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-bench"
version = "0.2.3"
description = "Offscreen frame-path measurements for Kilix"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "itsmygithubacct"}]

[project.scripts]
kilix-bench = "kilix_bench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
mouse = ["kitty-input @ git+https://github.com/itsmygithubacct/kitty-input.git@0f009064f3f32c7ea972a3d90de1522eda409e89#subdirectory=python"]

[tool.setuptools.package-data]
kilix_bench = ["mouse-parser-pin.json"]
